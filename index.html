<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Super Pixel Bros</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cg fill='%23000'%3E%3Crect x='5' y='1' width='6' height='1'/%3E%3Crect x='3' y='2' width='10' height='1'/%3E%3Crect x='1' y='3' width='14' height='7'/%3E%3Crect x='4' y='10' width='8' height='5'/%3E%3C/g%3E%3Cg fill='%23e52521'%3E%3Crect x='5' y='2' width='6' height='1'/%3E%3Crect x='3' y='3' width='10' height='1'/%3E%3Crect x='2' y='4' width='12' height='5'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Crect x='4' y='4' width='3' height='3'/%3E%3Crect x='9' y='3' width='3' height='3'/%3E%3Crect x='12' y='6' width='1' height='2'/%3E%3C/g%3E%3Crect x='5' y='10' width='6' height='4' fill='%23f8d8a8'/%3E%3Cg fill='%23000'%3E%3Crect x='6' y='11' width='1' height='2'/%3E%3Crect x='9' y='11' width='1' height='2'/%3E%3C/g%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#0b0b14;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#5c94fc}
  #ui{position:fixed;top:6px;right:6px;display:flex;gap:6px;z-index:5}
  #ui button{width:30px;height:30px;border-radius:7px;border:2px solid rgba(255,255,255,.75);background:rgba(0,0,0,.45);
    color:#fff;font:16px/1 sans-serif;cursor:pointer;padding:0}
  #ui button:hover{background:rgba(255,255,255,.3)}
  #touch{display:none;position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none}
  body.touch #touch{display:block}
  #touch button{position:absolute;bottom:14px;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.7);
    background:rgba(255,255,255,.22);color:#fff;font:bold 15px monospace;pointer-events:auto;touch-action:none}
  #touch button.on{background:rgba(255,255,255,.5)}
  #bL{left:14px}#bR{left:92px}#bRun{right:92px}#bJump{right:14px}
</style>
</head>
<body>
<canvas id="c" width="400" height="224"></canvas>
<div id="ui">
  <button id="uSnd" title="Sound on/off (M)">&#128266;</button>
  <button id="uFs" title="Fullscreen (F)">&#9974;</button>
</div>
<div id="touch">
  <button id="bL">&#9664;</button><button id="bR">&#9654;</button>
  <button id="bRun">RUN</button><button id="bJump">JUMP</button>
</div>
<script>
'use strict';
// ============================================================
//  SUPER PIXEL BROS - single file, no libraries, no assets
// ============================================================

// ---------- Tunable constants ----------
const H = 224, T = 16, ROWS = 14;   // world is 224 units tall; width adapts to the window
let W = 400, S = 1;                  // W: visible width in world units, S: device pixels per world unit
const C = {
  WALK: 90, RUN: 150,            // max speed, px/s
  ACCEL: 520, AIR_ACCEL: 380, FRICTION: 600,
  GRAV: 1400, FALL_MULT: 1.35,   // fall gravity multiplier
  JUMP_V: 440, JUMP_CUT: 0.45,   // jump height ~4 tiles; release cuts it short
  MAX_FALL: 520,
  COYOTE: 0.10, BUFFER: 0.10,    // seconds
  STOMP_BOUNCE: 260,
  ENEMY_SPEED: 30, SHELL_SPEED: 200,
  STEP: 1 / 60,
  START_LIVES: 3
};

// ---------- Level definitions ----------
// rows: [tileX, tileY, "string of tiles"]  B brick, ? question block
// m: tiles whose ? block holds a mushroom (others hold a coin)
const LEVELS = [
  { w: 120, time: 300, sky: '#5c94fc', hill: '#3cb43c', hill2: '#2a8a2a', cloud: '#fff', stars: false, tune: 0,
    pits: [[30,2],[56,3],[88,3]],
    pipes: [[20,2],[44,3],[70,2],[100,3]],
    rows: [[12,8,'B?B?B'],[26,8,'?'],[34,8,'BBB'],[35,5,'B?B'],[48,8,'?B?'],[62,8,'BBBBB'],[76,8,'B?B'],[84,5,'BBBBBB'],[94,8,'?']],
    m: [[13,8],[36,5],[77,8]],
    enemies: [[22,'g'],[26,'g'],[36,'g'],[40,'g'],[41,'g'],[50,'k'],[60,'g'],[66,'g'],[78,'g'],[80,'k'],[92,'g'],[94,'g']],
    coins: [[38,9],[39,9],[40,9],[57,8],[58,7],[59,8],[72,6],[73,6],[85,3],[86,3],[87,3]] },
  { w: 140, time: 300, sky: '#d9824f', hill: '#5a8a3a', hill2: '#3f6a2a', cloud: '#ffe0b0', stars: false, tune: 1,
    pits: [[24,2],[40,3],[58,3],[75,4],[100,3],[112,2]],
    pipes: [[18,2],[32,3],[50,2],[66,3],[90,2],[120,3]],
    rows: [[10,8,'B?B'],[28,8,'?B?B'],[29,5,'BB'],[46,8,'B?B?B'],[54,8,'BBBB'],[62,5,'???'],[70,8,'?'],[80,8,'B?B'],[95,8,'BB?BB'],[106,5,'B?B'],[116,8,'?B?']],
    m: [[11,8],[47,8],[63,5],[97,8]],
    enemies: [[14,'g'],[22,'k'],[28,'g'],[36,'g'],[37,'g'],[45,'k'],[55,'g'],[56,'g'],[64,'k'],[72,'g'],[84,'g'],[85,'g'],[93,'k'],[98,'g'],[108,'g'],[118,'k']],
    coins: [[28,6],[29,3],[30,3],[41,8],[59,8],[76,7],[77,6],[78,6],[79,7],[107,3],[108,3]] },
  { w: 160, time: 300, sky: '#14143c', hill: '#1e3a4a', hill2: '#142a38', cloud: '#5a5a8a', stars: true, tune: 2,
    pits: [[20,3],[34,4],[50,3],[64,5],[80,4],[96,3],[110,4],[124,3]],
    pipes: [[14,3],[28,2],[44,4],[58,2],[72,3],[90,2],[104,3],[118,2]],
    rows: [[8,8,'?B?'],[24,8,'BBB'],[25,5,'?'],[38,8,'B?B'],[39,5,'BBB'],[54,8,'?B?B?'],[62,5,'BBBB'],[76,8,'B?B'],[86,8,'?'],[100,8,'B?B?B'],[114,8,'???'],[130,8,'B?B'],[134,5,'BBB']],
    m: [[8,8],[39,8],[56,8],[101,8],[115,8],[131,8]],
    enemies: [[10,'g'],[18,'k'],[26,'g'],[27,'g'],[32,'k'],[40,'g'],[46,'g'],[47,'g'],[56,'k'],[62,'g'],[70,'g'],[76,'k'],[85,'g'],[88,'g'],[94,'k'],[102,'g'],[108,'g'],[116,'k'],[120,'g'],[122,'g'],[130,'g'],[138,'k']],
    coins: [[21,8],[35,6],[36,5],[37,5],[65,8],[66,7],[67,7],[68,8],[81,8],[82,7],[111,8],[112,7],[134,3],[135,3]] }
];

// ---------- Canvas / scaling ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
// Render at the screen's native resolution and fill the whole window.
function resize() {
  const dpr = window.devicePixelRatio || 1, cw = innerWidth, ch = innerHeight;
  const a = Math.max(1.45, Math.min(2.85, cw / ch));            // supported view aspect range
  const cssW = Math.floor(a < cw / ch ? ch * a : cw), cssH = Math.floor(a < cw / ch ? ch : cw / a);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  S = cv.height / H; W = cv.width / S;
  ctx.setTransform(S, 0, 0, S, 0, 0);
}
addEventListener('resize', resize); resize();
const snap = v => Math.round(v * S) / S;                         // align to device pixels (crisp, no seams)
let camS = 0;
function enterFs() {
  const el = document.documentElement;
  try { if (!document.fullscreenElement) { const f = el.requestFullscreen || el.webkitRequestFullscreen; if (f) Promise.resolve(f.call(el)).catch(() => {}); } } catch (e) {}
}
function toggleFs() {
  try {
    if (document.fullscreenElement) Promise.resolve(document.exitFullscreen()).catch(() => {});
    else enterFs();
  } catch (e) {}
}
function updateSndBtn() { document.getElementById('uSnd').innerHTML = A.muted ? '&#128263;' : '&#128266;'; }
function toggleMute() { A.muted = !A.muted; updateSndBtn(); if (!A.muted) { ensureAudio(); sfx('coin'); } }
[['uSnd', toggleMute], ['uFs', toggleFs]].forEach(([id, fn]) => {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); ensureAudio(); fn(); });
});
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');

// ---------- Global state ----------
const G = { state: 'title', level: 0, score: 0, coins: 0, lives: C.START_LIVES, time: 300, hi: 0, t: 0,
            flagPhase: 0, flagT: 0, flagY: 0, bonus: 0, flagPts: 0, showFps: false, fps: 0 };
let paused = false;
let grid, lw, qc, ents, items, coinsL, popups, parts, bumps, flagX, player, cam = { x: 0 }, theme;
try { G.hi = +localStorage.getItem('spb_hi') || 0; } catch (e) {}
function saveHi() {
  if (G.score > G.hi) { G.hi = G.score; try { localStorage.setItem('spb_hi', String(G.hi)); } catch (e) {} }
}

// ---------- Input ----------
const K = { left: false, right: false, jump: false, run: false, jumpEdge: false };
const keyMap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
                 Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', ShiftLeft: 'run', ShiftRight: 'run', KeyX: 'run' };
function setKey(name, down) {
  if (name === 'jump' && down && !K.jump) K.jumpEdge = true;
  K[name] = down;
}
addEventListener('keydown', e => {
  ensureAudio();
  const k = keyMap[e.code];
  if (k) { e.preventDefault(); if (!e.repeat) setKey(k, true); return; }
  if (e.repeat) return;
  if (e.code === 'Enter') { e.preventDefault(); confirm(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'KeyF') toggleFs();
  else if (e.code === 'KeyG') G.showFps = !G.showFps;
});
addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) { e.preventDefault(); setKey(k, false); } });
addEventListener('blur', () => { K.left = K.right = K.jump = K.run = false; if (G.state === 'play') paused = true; audioPower(false); });
cv.addEventListener('pointerdown', e => { ensureAudio(); confirm(); });
[['bL','left'],['bR','right'],['bRun','run'],['bJump','jump']].forEach(([id, name]) => {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); ensureAudio(); b.classList.add('on'); setKey(name, true); confirm(true); };
  const off = e => { e.preventDefault(); b.classList.remove('on'); setKey(name, false); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, off));
});
function togglePause() { if (G.state === 'play') { paused = !paused; sfx('pause'); } }
function confirm(fromJump) {
  if (G.state === 'title') { if (!fromJump || true) newGame(); }
  else if (G.state === 'intro' && G.t > 0.3) { G.state = 'play'; G.t = 0; }
  else if (G.state === 'clear' && G.t > 0.8) nextLevel();
  else if ((G.state === 'over' || G.state === 'win') && G.t > 0.8) toTitle();
  else if (G.state === 'play' && paused) paused = false;
}

// ---------- Audio (Web Audio only) ----------
const A = { ctx: null, master: null, muted: false, next: 0, step: 0 };
function ensureAudio() {
  if (!A.ctx) {
    try {
      A.ctx = new (window.AudioContext || window.webkitAudioContext)();
      A.master = A.ctx.createGain(); A.master.gain.value = 1.6; A.master.connect(A.ctx.destination);
      const n = A.ctx.sampleRate * 0.5, buf = A.ctx.createBuffer(1, n, A.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      A.noiseBuf = buf;
      setInterval(sched, 80);
    } catch (e) { A.ctx = null; }
  }
  A.sleep = false;
  if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
}
// Audio only runs while the game is on screen and not finished.
function audioPower(on) { if (!A.ctx) return; try { if (on) A.ctx.resume(); else A.ctx.suspend(); } catch (e) {} }
function silenceAfter(ms) {                                          // switch sound fully off after a final jingle
  setTimeout(() => { if (G.state === 'over' || G.state === 'win' || G.state === 'title') { A.sleep = true; audioPower(false); } }, ms);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { audioPower(false); if (G.state === 'play') paused = true; }
  else if (!A.sleep) audioPower(true);
});
addEventListener('focus', () => { if (!A.sleep && !document.hidden) audioPower(true); });
function beep(f0, f1, d, type = 'square', vol = 0.07, delay = 0) {
  if (!A.ctx || A.muted) return;
  const t = A.ctx.currentTime + delay, o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, vol, delay = 0, cutoff = 6000) {                // percussive noise burst (hi-hat / snare)
  if (!A.ctx || A.muted || !A.noiseBuf) return;
  const t = A.ctx.currentTime + delay, s = A.ctx.createBufferSource(), f = A.ctx.createBiquadFilter(), g = A.ctx.createGain();
  s.buffer = A.noiseBuf; f.type = 'highpass'; f.frequency.value = cutoff;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t); s.stop(t + d + 0.02);
}
function arp(notes, step, type, vol) { notes.forEach((n, i) => beep(n, n, step * 1.4, type || 'square', vol || 0.06, i * step)); }
const SFX = {
  jump:   () => beep(300, 650, 0.18),
  coin:   () => { beep(988, 988, 0.07); beep(1319, 1319, 0.25, 'square', 0.07, 0.07); },
  stomp:  () => beep(220, 80, 0.12),
  bump:   () => beep(130, 90, 0.08, 'triangle', 0.12),
  brk:    () => beep(180, 40, 0.22, 'sawtooth', 0.08),
  appear: () => beep(200, 760, 0.3),
  power:  () => arp([523, 659, 784, 1047, 1319, 1568], 0.05),
  // hit by an enemy: power-down stinger (low thud + falling sweep + descending notes)
  hurt:   () => { noise(0.18, 0.22, 0, 700); beep(700, 120, 0.4, 'sawtooth', 0.09); arp([784, 659, 523, 392, 311], 0.07, 'square', 0.07); },
  kick:   () => beep(320, 140, 0.09),
  // death theme: sad minor descent over a low drone, ~2 seconds
  die:    () => {
    noise(0.25, 0.25, 0, 600); beep(500, 60, 0.45, 'sawtooth', 0.08);
    const m = [494, 466, 440, 415, 392, 370, 330, 294, 262];
    m.forEach((f, i) => { beep(f, f * 0.985, 0.3, 'triangle', 0.16, 0.5 + i * 0.17); beep(f / 2, f / 2, 0.3, 'square', 0.04, 0.5 + i * 0.17); });
    beep(110, 98, 1.9, 'sawtooth', 0.04, 0.5);
  },
  flag:   () => beep(900, 120, 0.9, 'triangle', 0.1),
  clear:  () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.1),
  oneup:  () => arp([660, 784, 1319, 1047, 1175, 1568], 0.07),
  win:    () => arp([523, 659, 784, 1047, 1319, 1047, 1319, 1568, 2093], 0.11),
  start:  () => arp([392, 523, 659, 784, 1047], 0.07),
  over:   () => arp([523, 494, 466, 440, 392, 330, 262], 0.16, 'triangle', 0.1),
  pause:  () => { beep(880, 880, 0.06); beep(660, 660, 0.1, 'square', 0.07, 0.07); },
  hurry:  () => arp([1568, 1319, 1568, 1319], 0.09),
  brkhit: () => { noise(0.18, 0.2, 0, 1500); beep(160, 50, 0.2, 'sawtooth', 0.07); },
  squish: () => { noise(0.07, 0.15, 0, 3000); beep(260, 90, 0.1); }
};
function sfx(n) { try { SFX[n](); } catch (e) {} }
// original looping tune: pentatonic melody + bass
const MEL = [0,4,7,12, 7,4,7,9, 5,9,12,9, 7,4,2,4, 0,4,7,12, 14,12,9,7, 5,7,9,5, 7,null,0,null];
const BASS = [0,0,5,5, 0,0,-5,-5];
const TRANS = [0, -2, 3];
function sched() {
  const c = A.ctx; if (!c) return;
  const playing = G.state === 'play' && !paused && player && !player.dead && !(player.grow > 0) && !A.muted && !document.hidden;
  if (!playing) { A.next = c.currentTime + 0.05; return; }
  while (A.next < c.currentTime + 0.2) {
    const i = A.step % MEL.length, n = MEL[i], tr = TRANS[LEVELS[G.level].tune], d = A.next - c.currentTime;
    if (n !== null) { const f = 261.63 * Math.pow(2, (n + tr) / 12); beep(f, f, 0.15, 'square', 0.04, d); }
    if (i % 4 === 0) {
      const f = 130.8 * Math.pow(2, (BASS[(i / 4) | 0] + tr) / 12); beep(f, f, 0.5, 'triangle', 0.1, d);
      beep(150, 45, 0.14, 'sine', 0.16, d);                                         // kick
    }
    if (i % 4 === 2) noise(0.09, 0.07, d, 1800);                                    // snare
    if (i % 2 === 1) noise(0.03, 0.04, d, 7000);                                    // hi-hat
    A.next += G.time < 100 ? 0.12 : 0.17; A.step++;
  }
}

// ---------- Level loading ----------
function loadLevel(i) {
  const L = LEVELS[i]; lw = L.w; theme = L;
  grid = []; qc = {};
  for (let y = 0; y < ROWS; y++) grid.push(new Array(lw).fill(' '));
  for (let x = 0; x < lw; x++) { grid[12][x] = '#'; grid[13][x] = '#'; }
  L.pits.forEach(([x, w]) => { for (let k = 0; k < w; k++) { grid[12][x + k] = ' '; grid[13][x + k] = ' '; } });
  L.pipes.forEach(([x, h]) => { for (let k = 0; k < 2; k++) for (let r = 0; r < h; r++) grid[11 - r][x + k] = 'P'; });
  L.rows.forEach(([x, y, s]) => [...s].forEach((c, k) => { grid[y][x + k] = c; }));
  L.m.forEach(([x, y]) => { qc[y * lw + x] = 'm'; });
  const sx = lw - 16;
  for (let k = 0; k < 8; k++) for (let r = 0; r <= k; r++) grid[11 - r][sx + k] = 'S';
  flagX = (lw - 5) * T;
  ents = L.enemies.map(([x, t]) => t === 'g'
    ? { type: 'g', x: x * T + 1, y: 12 * T - 14, w: 14, h: 14, vx: -C.ENEMY_SPEED, vy: 0, mode: 'walk', dead: false, squash: 0, anim: 0, onGround: true }
    : { type: 'k', x: x * T + 1, y: 12 * T - 20, w: 14, h: 20, vx: -C.ENEMY_SPEED, vy: 0, mode: 'walk', dead: false, squash: 0, anim: 0, onGround: true, kick: 0 });
  items = []; popups = []; parts = []; bumps = [];
  coinsL = L.coins.map(([x, y]) => ({ x: x * T, y: y * T, got: false }));
  G.flagY = 3 * T; G.flagPhase = 0; G.flagT = 0;
  cam.x = 0;
  player = makePlayer();
}
function makePlayer() {
  return { x: 3 * T, y: 12 * T - 14, w: 12, h: 14, vx: 0, vy: 0, big: false, face: 1, onGround: true,
           coyote: 0, buffer: 0, inv: 0, anim: 0, dead: false, deadT: 0, land: 0, jumping: false, grow: 0, grace: 0 };
}
function newGame() {
  G.score = 0; G.coins = 0; G.lives = C.START_LIVES; G.level = 0;
  enterFs(); sfx('start');
  beginLevel();
}
function beginLevel() {
  loadLevel(G.level); G.time = LEVELS[G.level].time; G.state = 'intro'; G.t = 0; paused = false;
  K.jumpEdge = false; A.step = 0;
}
function nextLevel() {
  if (G.level + 1 >= LEVELS.length) { G.state = 'win'; G.t = 0; saveHi(); sfx('win'); silenceAfter(2600); }
  else { G.level++; beginLevel(); }
}
function toTitle() { G.state = 'title'; G.t = 0; loadLevel(0); }

// ---------- Physics helpers ----------
function solid(tx, ty) {
  if (tx < 0 || tx >= lw) return true;
  if (ty < 0 || ty >= ROWS) return false;
  return grid[ty][tx] !== ' ';
}
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
// Axis-separated AABB movement. Returns {x: -1|0|1, up, down, hit:[tx,ty]}
function moveBody(b, dt) {
  const r = { x: 0, up: false, down: false, hit: null };
  b.x += b.vx * dt;
  let y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  if (b.vx > 0) {
    const tx = Math.floor((b.x + b.w - 0.01) / T);
    for (let ty = y0; ty <= y1; ty++) if (solid(tx, ty)) { b.x = tx * T - b.w; r.x = 1; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x / T);
    for (let ty = y0; ty <= y1; ty++) if (solid(tx, ty)) { b.x = (tx + 1) * T; r.x = -1; break; }
  }
  b.y += b.vy * dt;
  const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T);
  if (b.vy > 0) {
    const ty = Math.floor((b.y + b.h - 0.01) / T);
    for (let tx = x0; tx <= x1; tx++) if (solid(tx, ty)) { b.y = ty * T - b.h; r.down = true; b.vy = 0; break; }
  } else if (b.vy < 0) {
    const ty = Math.floor(b.y / T), cx = b.x + b.w / 2;
    let best = null;
    for (let tx = x0; tx <= x1; tx++) if (solid(tx, ty)) {

    }

// ---------- Player ----------

function updatePlayer(dt) {
  const p = player;
  const dir = (K.right ? 1 : 0) - (K.left ? 1 : 0);
  const max = K.run ? C.RUN : C.WALK;
  if (dir) {
    const a = (p.onGround ? C.ACCEL : C.AIR_ACCEL) * (dir * p.vx < 0 ? 1.8 : 1);
    p.vx += dir * a * dt; p.face = dir;
    if (Math.abs(p.vx) > max) p.vx = Math.sign(p.vx) * Math.max(max, Math.abs(p.vx) - C.FRICTION * dt);
  } else if (p.onGround) {
    const f = C.FRICTION * dt; p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
  }
  // coyote time + jump buffering
  p.coyote = p.onGround ? C.COYOTE : Math.max(0, p.coyote - dt);
  if (K.jumpEdge) { p.buffer = C.BUFFER; K.jumpEdge = false; } else p.buffer = Math.max(0, p.buffer - dt);
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -C.JUMP_V; p.buffer = 0; p.coyote = 0; p.jumping = true; p.onGround = false; sfx('jump');
  }
  if (p.vy < 0 && !K.jump && p.jumping) { p.vy *= C.JUMP_CUT; p.jumping = false; }
  p.vy = Math.min(p.vy + C.GRAV * (p.vy > 0 ? C.FALL_MULT : 1) * dt, C.MAX_FALL);

  const wasAir = !p.onGround;
  const r = moveBody(p, dt);
  p.onGround = r.down;
  if (r.down) { p.jumping = false; if (wasAir) p.land = 0.12; }
  if (r.x) p.vx = 0;
  if (r.up) { p.jumping = false; hitBlock(r.hit[0], r.hit[1]); }
  if (p.x < cam.x) { p.x = cam.x; if (p.vx < 0) p.vx = 0; }
  p.anim += Math.abs(p.vx) * dt * 0.12;
  p.land = Math.max(0, p.land - dt);
  p.inv = Math.max(0, p.inv - dt);
  p.grace = Math.max(0, p.grace - dt);
  if (p.y > ROWS * T + 8) die();
}

// ---------- Enemies, items ----------
function updateEnemy(e, dt) {
  if (e.dead) { e.vy += C.GRAV * dt; e.y += e.vy * dt; return; }
  if (e.squash > 0) { e.squash -= dt; return; }
  if (e.x > cam.x + W + 48 || e.x + e.w < cam.x - 64) return;      // only simulate near the screen
  e.anim += dt;
  if (e.kick > 0) e.kick -= dt;
  e.vy = Math.min(e.vy + C.GRAV * dt, C.MAX_FALL);
  const r = moveBody(e, dt);
  e.onGround = r.down;
  if (r.x) e.vx = -Math.abs(e.vx) * r.x;
  if (e.mode === 'walk' && e.onGround) {                           // turn around at ledges
    const ax = Math.floor((e.vx > 0 ? e.x + e.w + 1 : e.x - 1) / T), ty = Math.floor((e.y + e.h + 2) / T);
    if (!solid(ax, ty)) e.vx = -e.vx;
  }
  if (e.mode === 'slide') {
    ents.forEach(o => { if (o !== e && !o.dead && !o.squash && o.mode !== 'slide' && overlap(e, o)) killEnemy(o, 200); });
  }
}
function updateItem(m, dt) {
  if (m.emerge < 1) {
    m.emerge = Math.min(1, m.emerge + dt / 0.5);
    m.y = (m.ty + 14) + (m.ty - (m.ty + 14)) * m.emerge;
    if (m.emerge >= 1) m.vx = 45;
    return;
  }
  m.vy = Math.min(m.vy + C.GRAV * dt, C.MAX_FALL);
  const r = moveBody(m, dt);
  if (r.x) m.vx = -Math.abs(m.vx) * r.x;

  if (overlap(m, player)) { m.dead = true; powerUp(); }
}
function playerVsEnemies(dt) {
  const p = player;
  for (const e of ents) {
    if (e.dead || e.squash > 0 || !overlap(p, e)) continue;
    if (e.mode === 'shell') {                                       // idle shell: kick it
      if (e.kick > 0) continue;
      e.mode = 'slide'; e.vx = (p.x + p.w / 2 < e.x + e.w / 2) ? C.SHELL_SPEED : -C.SHELL_SPEED; e.kick = 0.25;
      addScore(400, e.x, e.y - 8); sfx('kick');
      if (p.vy > 0 && p.y + p.h <= e.y + 9) p.vy = -C.STOMP_BOUNCE;
      continue;
    }
    if (e.mode === 'slide' && e.kick > 0) continue;
    const stomp = p.vy > 0 && p.y + p.h <= e.y + 9;
    if (stomp) {

      else { e.mode = 'shell'; e.vx = 0; e.kick = 0.4; }            // stomped a sliding shell
    } else hurt();

// ---------- Update ----------
function updateFx(dt) {

  popups.forEach(o => o.t += dt); popups = popups.filter(o => o.t < 0.8);

}
function updatePlay(dt) {

  ctx.translate(snap(p.x - camS + p.w / 2), snap(p.y + p.h));
  ctx.scale(p.face * sx, sy);
  const h = p.h, capH = p.big ? 6 : 4, faceH = p.big ? 6 : 4, t = -h, torso = h - capH - faceH - 3;
  const red = '#d82020', blue = '#2848d8', skin = '#f8b878';
  rect(-6, t, 12, capH, red); rect(1, t + capH - 1, 6, 2, red);                    // cap + brim
  rect(-5, t + capH, 9, faceH, skin); rect(2, t + capH + 1, 1, 2, '#000'); rect(-1, t + capH + faceH - 2, 5, 1, '#6a3a10');
  rect(-6, t + capH, 2, faceH - 1, '#6a3a10');                                     // hair
  rect(-6, t + capH + faceH, 12, torso, blue); rect(-6, t + capH + faceH, 3, Math.max(1, torso - 1), red); rect(3, t + capH + faceH, 3, Math.max(1, torso - 1), red);
  rect(-3, t + capH + faceH + 1, 1, 1, '#ffd020'); rect(2, t + capH + faceH + 1, 1, 1, '#ffd020');
  const run = p.onGround && Math.abs(p.vx) > 5 ? Math.floor(p.anim) % 2 : 0, air = !p.onGround;
  rect(air ? -7 : (run ? -7 : -6), -3, 6, 3, '#6a3a10'); rect(air ? 1 : (run ? 2 : 0), -3, 6, 3, '#6a3a10');
  ctx.restore();
}
function drawParts() {
  parts.forEach(q => {
    const x = snap(q.x - camS), y = snap(q.y);
    if (q.k === 'brick') { rect(x, y, 8, 8, '#b83c0c'); rect(x, y, 8, 1, '#e87848'); rect(x + 7, y, 1, 8, '#240800'); }
    else { const w = Math.abs(Math.cos(q.t * 18)) * 6 + 2; rect(x + 4 - w / 2, y, w, 12, '#ffd020'); }
  });
  popups.forEach(o => txt(o.text, o.x - camS, o.y - o.t * 28, '#fff', 'left', 8));
}
function pad(n, l) { return String(n).padStart(l, '0'); }
function drawHud() {
  const u = W / 100;                                                // HUD spreads with the window width
  txt('PIP', 3 * u, 4); txt(pad(G.score, 6), 3 * u, 14);
  txt('● x' + pad(G.coins, 2), 22 * u, 14, '#ffd020');
  txt('WORLD', 40 * u, 4); txt('1-' + (G.level + 1), 42 * u, 14);
  txt('TIME', 56 * u, 4); txt(pad(Math.ceil(G.time), 3), 57 * u, 14, G.time < 100 ? '#ff6060' : '#fff');
  txt('LIVES', 68 * u, 4); txt('x' + G.lives, 70 * u, 14);
  txt('HI ' + pad(G.hi, 6), W - 8, H - 12, '#ddd', 'right', 8);
  if (A.muted) txt('MUTED (M)', 8, H - 12, '#ddd', 'left', 8);
  if (G.showFps) txt('FPS ' + G.fps, 8, 26, '#0f0', 'left', 8);
}
function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0); camS = snap(cam.x);
  drawBackground(); drawWorld();
  ents.forEach(drawEnemy); drawPlayer(); drawParts();
  const s = G.state;
  if (s === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
    txt('SUPER PIXEL BROS', W / 2, 40, '#ffd020', 'center', 26);
    txt('A Mario-style platformer', W / 2, 74, '#fff', 'center', 10);
    if (Math.floor(G.t * 2) % 2 === 0) txt('PRESS ENTER OR TAP TO START', W / 2, 112, '#fff', 'center', 11);
    txt('ARROWS / WASD move   SPACE jump   SHIFT run', W / 2, 148, '#ddd', 'center', 8);
    txt('P pause   M mute   F fullscreen   G fps', W / 2, 160, '#ddd', 'center', 8);
    txt('HI-SCORE ' + pad(G.hi, 6), W / 2, 184, '#ffd020', 'center', 9);
  } else if (s === 'intro') {
    rect(0, 0, W, H, '#000');
    txt('WORLD 1-' + (G.level + 1), W / 2, 80, '#fff', 'center', 16);
    txt('♥ x ' + G.lives, W / 2, 112, '#ff8080', 'center', 14);
    txt('GET READY!', W / 2, 140, '#ddd', 'center', 9);
  } else {
    drawHud();
    if (s === 'play' && paused) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H); txt('PAUSED', W / 2, 90, '#fff', 'center', 20); txt('P or ENTER to resume', W / 2, 120, '#ddd', 'center', 9); }
    if (s === 'over') { ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, H); txt('GAME OVER', W / 2, 72, '#ff6060', 'center', 24); txt('SCORE ' + pad(G.score, 6), W / 2, 112, '#fff', 'center', 11); txt('HI-SCORE ' + pad(G.hi, 6), W / 2, 128, '#ffd020', 'center', 11); if (G.t > 0.8) txt('PRESS ENTER OR TAP', W / 2, 160, '#ddd', 'center', 9); }
    if (s === 'clear') { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); txt('COURSE CLEAR!', W / 2, 60, '#ffd020', 'center', 22);
      txt('FLAG BONUS  ' + G.flagPts, W / 2, 98, '#fff', 'center', 10); txt('TIME BONUS  ' + G.bonus, W / 2, 112, '#fff', 'center', 10);
      txt('SCORE ' + pad(G.score, 6), W / 2, 134, '#fff', 'center', 11); if (G.t > 0.8) txt('PRESS ENTER OR TAP', W / 2, 164, '#ddd', 'center', 9); }
    if (s === 'win') { ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, H); txt('YOU WIN!', W / 2, 54, '#ffd020', 'center', 26);
      txt('All 3 worlds cleared. Thanks for playing!', W / 2, 96, '#fff', 'center', 9); txt('FINAL SCORE ' + pad(G.score, 6), W / 2, 118, '#fff', 'center', 12);
      txt('HI-SCORE ' + pad(G.hi, 6), W / 2, 136, '#ffd020', 'center', 10); if (G.t > 0.8) txt('PRESS ENTER OR TAP', W / 2, 166, '#ddd', 'center', 9); }
  }
}

// ---------- Main loop (fixed timestep, delta-time capped) ----------
let last = 0, acc = 0, fpsN = 0, fpsT = 0;
function frame(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05); last = ts; acc += dt;
  fpsN++; fpsT += dt; if (fpsT >= 0.5) { G.fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  let n = 0;
  while (acc >= C.STEP && n < 5) { update(C.STEP); acc -= C.STEP; n++; }
  if (n === 5) acc = 0;
  render();
  requestAnimationFrame(frame);
}
loadLevel(0);
requestAnimationFrame(frame);
</script>
